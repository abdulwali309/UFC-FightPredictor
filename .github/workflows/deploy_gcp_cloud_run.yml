name: Deploy API (Google Cloud Run)

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  IMAGE_NAME: ufc-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${IMAGE_NAME}"
          docker build -t "${IMAGE_URI}:${IMAGE_SHA}" .
          docker tag "${IMAGE_URI}:${IMAGE_SHA}" "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${IMAGE_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy Cloud Run service
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${IMAGE_NAME}:latest"
          cat > .cloudrun-env.yaml <<EOF
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          CORS_ORIGINS: "${{ secrets.CORS_ORIGINS }}"
          CORS_ORIGIN_REGEX: "${{ secrets.CORS_ORIGIN_REGEX }}"
          EOF
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_URI}" \
            --platform managed \
            --region "${GCP_REGION}" \
            --allow-unauthenticated \
            --port 8000 \
            --min-instances 0 \
            --max-instances 3 \
            --cpu 1 \
            --memory 1Gi \
            --env-vars-file .cloudrun-env.yaml
